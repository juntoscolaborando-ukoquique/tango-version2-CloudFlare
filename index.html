<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tango Cifrado · redirigiendo…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a110f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="pwa/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="pwa/icons/icon-192.png" />
    <link rel="manifest" href="pwa/manifest.json" />
    <script>
      // Redirect synchronously in <head> — before any meta-refresh or body
      // parsing — so location.hash (the #c=... deep link fragment) is
      // preserved. A static <meta http-equiv="refresh"> fires before <body>
      // scripts but AFTER <head> scripts, so putting this here wins the race.
      // location.replace() keeps the back button clean.
      try {
        window.location.replace("./pwa/index.html" + location.hash);
      } catch (_) {
        window.location.href = "./pwa/index.html" + location.hash;
      }
    </script>
    <style>
      :root {
        --ink: #f6e7d2;
        --muted: #c9b39a;
        --surface: #2a1b15;
        --brass: #d4a85c;
        --line: #3a2720;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--surface);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
      }
      .card {
        background: #231712;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.5rem 1.5rem 1.4rem;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 1rem;
      }
      a.cta {
        display: inline-block;
        background: var(--brass);
        color: #2a1b15;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        width: 100%;
        text-align: center;
      }
      a.cta:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="card">
        <h1>Tango Cifrado</h1>
        <p>Redirigiendo a la app…</p>
        <noscript>
          <p style="color:#e8c07a;">
            Tu navegador tiene JavaScript desactivado o no siguió el
            redirect. Tocá el botón.
          </p>
        </noscript>
        <a class="cta" href="./pwa/index.html">Abrir Tango Cifrado →</a>
      </main>
    </div>
  </body>
</html>
